<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alien Tic-Tac-Toe</title>
<style>
:root{--ink:#24305e;--purple:#8b5cf6;--lavender:#eeeaff;--green:#83e35c;--green-dark:#328b48;--blue:#dce9ff;--pink:#f1a5ff;--card:rgba(255,255,255,.88)}
*{box-sizing:border-box} body{margin:0;min-height:100vh;font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 15%,#fff7c7 0 2px,transparent 3px),radial-gradient(circle at 80% 22%,#c4b5fd 0 3px,transparent 4px),linear-gradient(145deg,#e7f4ff,#f1eaff 55%,#e5fbdc);background-size:120px 120px,170px 170px,auto;display:flex;align-items:center;justify-content:center;padding:22px}
.wrap{width:min(100%,720px)}.card{background:var(--card);border:2px solid #fff;border-radius:28px;padding:clamp(18px,4vw,34px);box-shadow:0 18px 50px #51469b22;text-align:center;backdrop-filter:blur(8px)}
h1{font-size:clamp(2.1rem,7vw,3.5rem);line-height:1;margin:8px 0;color:#6744bc;letter-spacing:-1.5px;text-shadow:2px 3px 0 #d9d0ff} .subtitle{margin:12px auto 20px;max-width:440px;line-height:1.5;color:#53608c}.mascots{display:flex;justify-content:space-around;align-items:end;gap:14px;margin:12px 0 18px}.alien{font-size:clamp(3.5rem,12vw,6rem);filter:drop-shadow(0 5px 0 #443b8a18);line-height:1}.speech{background:white;border:2px solid #d7dcff;border-radius:16px;padding:9px 13px;font-weight:800;min-height:43px;display:flex;align-items:center;justify-content:center;max-width:340px;margin:0 auto 16px}.scores{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:12px 0 16px}.score{border:2px solid #d9e1ff;background:#fff;border-radius:15px;padding:9px 16px;font-weight:800;min-width:112px}.score span{font-size:1.25rem;margin-right:5px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;width:min(100%,390px);margin:0 auto 20px}.cell{aspect-ratio:1;border:2px solid #a9bff5;border-radius:17px;background:linear-gradient(145deg,#fff,#edf3ff);font-size:clamp(2.5rem,11vw,4.4rem);font-weight:900;color:#6b8de8;cursor:pointer;box-shadow:0 4px 0 #d1dcfb;transition:transform .12s,background .12s,box-shadow .12s}.cell:hover:enabled{transform:translateY(-2px);background:#fff9d9}.cell:disabled{cursor:default}.cell.o{color:#a348c7}.cell.win{background:#e2ffd7;border-color:#72d66a;box-shadow:0 4px 0 #a6e99b}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:13px 24px;font:inherit;font-weight:900;cursor:pointer;transition:transform .12s}.btn:hover{transform:translateY(-2px)}.primary{background:var(--green);color:#214a30;box-shadow:0 4px 0 #51b64e}.secondary{background:#fff;color:#4e5790;border:2px solid #b9c8f6}.hidden{display:none!important}.small{font-size:.88rem;color:#737ba4;margin:18px 0 0}.settings{display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:14px 0}.setting{display:flex;align-items:center;gap:7px;font-size:.92rem;font-weight:700}.setting input{accent-color:#69ca59;width:17px;height:17px}.result-title{font-size:1.35rem;font-weight:900;color:#6744bc;margin:4px 0 12px}.footer{font-size:.8rem;color:#8790b2;margin-top:16px}
@media(max-width:420px){body{padding:12px}.card{padding:18px 13px;border-radius:22px}.board{gap:7px}.cell{border-radius:13px}.score{min-width:100px;padding:8px 10px}}
</style>
</head>
<body><main class="wrap"><section class="card">
<div id="welcome"><div class="mascots"><div class="alien" aria-hidden="true">👽</div><div class="alien" aria-hidden="true">🛸</div></div><h1>Alien<br>Tic-Tac-Toe</h1><p class="subtitle">Can you outsmart the space visitor? Get three Xs in a row before the alien gets three Os!</p><button class="btn primary" id="playBtn">🚀 Play</button></div>
<div id="game" class="hidden"><h1 style="font-size:clamp(1.9rem,6vw,2.7rem)">Alien Tic-Tac-Toe</h1><div class="scores"><div class="score"><span>❌</span> You: <b id="playerScore">0</b></div><div class="score"><span>👾</span> Alien: <b id="alienScore">0</b></div><div class="score"><span>🤝</span> Draws: <b id="drawScore">0</b></div></div><div class="mascots"><div class="alien" aria-hidden="true">🧑‍🚀</div><div class="alien" id="alienFace" aria-hidden="true">👾</div></div><div class="speech" id="status" aria-live="polite">Your turn! Pick a square.</div><div class="board" id="board" role="group" aria-label="Tic tac toe board"></div><div id="result" class="result-title hidden"></div><div class="actions"><button class="btn primary hidden" id="againBtn">✨ Play Again</button><button class="btn secondary" id="menuBtn">Main Menu</button></div><div class="settings"><label class="setting"><input id="soundToggle" type="checkbox" checked> 🔊 Sound effects</label></div></div>
<p class="footer">Made for curious humans and friendly aliens ✨</p></section></main>
<script>
const $=id=>document.getElementById(id);let board=Array(9).fill(''),active=false,score={x:0,o:0,draw:0},soundOn=true;const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function beep(freq=540,duration=.09){if(!soundOn)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.type='sine';g.gain.value=.055;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+duration);o.stop(c.currentTime+duration)}catch(e){}}
function winner(){for(const line of wins){const [a,b,c]=line;if(board[a]&&board[a]===board[b]&&board[a]===board[c])return {mark:board[a],line}}return null}
function drawBoard(winLine=[]){$('board').innerHTML='';board.forEach((mark,i)=>{const b=document.createElement('button');b.className='cell'+(mark==='O'?' o':'')+(winLine.includes(i)?' win':'');b.textContent=mark==='X'?'×':mark==='O'?'○':'';b.setAttribute('aria-label',`Square ${i+1}${mark?', '+mark:' empty'}`);b.disabled=!active||!!mark;b.addEventListener('click',()=>playerMove(i));$('board').appendChild(b)})}
function startRound(){board=Array(9).fill('');active=true;$('result').classList.add('hidden');$('againBtn').classList.add('hidden');$('alienFace').textContent='👾';$('status').textContent='Your turn! Pick a square.';drawBoard();}
function finish(mark,line=[]){active=false;drawBoard(line);$('againBtn').classList.remove('hidden');if(mark==='X'){score.x++;$('result').textContent='🎉 You win! The galaxy celebrates!';$('status').textContent='Amazing move, space champion!';$('alienFace').textContent='😲';beep(780,.22)}else if(mark==='O'){score.o++;$('result').textContent='👾 The alien wins this round!';$('status').textContent='The alien got three in a row. Rematch?';$('alienFace').textContent='🥳';beep(230,.28)}else{score.draw++;$('result').textContent='🤝 It’s a cosmic draw!';$('status').textContent='You’re evenly matched. Try again!';$('alienFace').textContent='😵';beep(420,.16)}$('result').classList.remove('hidden');updateScores()}
function updateScores(){$('playerScore').textContent=score.x;$('alienScore').textContent=score.o;$('drawScore').textContent=score.draw}
function playerMove(i){if(!active||board[i])return;board[i]='X';beep(600);const w=winner();if(w){finish(w.mark,w.line);return}if(board.every(Boolean)){finish('draw');return}active=false;$('status').textContent='The alien is thinking…';$('alienFace').textContent='🤔';drawBoard();setTimeout(()=>{if($('game').classList.contains('hidden'))return;const empty=board.map((v,i)=>v?null:i).filter(i=>i!==null);if(!empty.length)return;const move=empty[Math.floor(Math.random()*empty.length)];board[move]='O';beep(380);const w2=winner();if(w2){finish(w2.mark,w2.line);return}if(board.every(Boolean)){finish('draw');return}active=true;$('status').textContent='Your turn! Pick a square.';$('alienFace').textContent='👾';drawBoard()},500)}
$('playBtn').addEventListener('click',()=>{$('welcome').classList.add('hidden');$('game').classList.remove('hidden');startRound()});$('againBtn').addEventListener('click',startRound);$('menuBtn').addEventListener('click',()=>{$('game').classList.add('hidden');$('welcome').classList.remove('hidden');active=false});$('soundToggle').addEventListener('change',e=>soundOn=e.target.checked);
</script></body></html>
